[package]
name = "rawgrep"
version = "0.2.0"
edition = "2024"
authors = ["Mark Tyrkba <marktyrkba456@gmail.com>"]
license = "MIT"
description = "Grep at the speed of raw disk"
repository = "https://github.com/rakivo/rawgrep"
keywords = ["regex", "grep", "egrep", "search", "pattern"]
categories = ["command-line-utilities", "text-processing"]
build = "build.rs"
rust-version = "1.85.1"
exclude = ["benchmark_results.tar.gz"]
default-run = "rawgrep"

[features]
default = ["mimalloc"]
use_nightly = []

hyperscan = ["dep:hyperscan"]
hyperscan-static = ["hyperscan", "hyperscan/static"]

enable-bytemuck-checks = []

# profiling
tracy = ["tracy-client/enable"]

# allocators
mimalloc = ["dep:mimalloc"]
dhat = ["dep:dhat"]

ignore-oracle-check = ["dep:ignore"]
profile-sort-lens = []

no-cache-stats = []

[dependencies]
hyperscan = { version = "0.3", optional = true }
regex-automata = { version = "0.4.18", default-features=false, features=["std", "meta", "unicode-perl", "unicode-script"] }

aho-corasick = { version = "1.1.4", default-features = false }
memchr = { version = "2.7.6", default-features = false, features = ["std"] }

libc = { version = "0.2.177", default-features = false }
memmap2 = { version = "0.9.11", default-features = false }

dhat = { version = "0.3.3", default-features = false, optional = true }
mimalloc = { version = "=0.1.47", optional = true }

smallvec = { version = "1.15.1", features = ["const_generics"] }
ctrlc = { version = "3.5.2", default-features = false }
tracy-client = { version = "0.17.3", default-features = false }

crossbeam-channel = { version = "0.5.15", default-features = false, features = ["std"] }
crossbeam-deque = { version = "0.8.7", default-features = false, features = ["std"] }

itoa = { version = "1.0.15", default-features = false }
fastrand = { version = "2.3.0", default-features = false, features = ["std"] }
bytemuck = { version = "1.24", features = ["derive"] }

bpaf = { version = "0.9.27", features = ["derive"], default-features = false }
nohash-hasher = { version = "0.2.0", default-features = false, features = ["std"] }
parking_lot = { version =  "0.12.5", default-features = false }
phf = { version = "0.14.0", features = ["macros"] }

ignore = { version = "0.4.30", optional = true }
regex-syntax = "0.8.11"

[target.'cfg(not(target_os = "macos"))'.dependencies]
gdt-cpus = { version = "0.2606.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[[bin]]
name = "gitignore_oracle_check"
required-features = ["ignore-oracle-check"]

[dev-dependencies]
proptest = "1"
tempfile = "3"

[build-dependencies]
rustc_version = "0.2"

[profile.release]
debug = 1

[profile.release-debug]
inherits = "release"
opt-level = 3
codegen-units = 1
debug = true
strip = false
overflow-checks = false
debug-assertions = false

[profile.release-fast]
inherits = "release"
opt-level = 3
panic = "abort"
codegen-units = 1
lto = "fat"
debug = false
strip = true
overflow-checks = false
debug-assertions = false

[profile.release-fast-without-lto-with-debug] # Use this profile if you're inspecting the LLVM IR with "cargo asm"
inherits = "release"
opt-level = 3
panic = "abort"
codegen-units = 1
lto = false
debug = 1
strip = false
overflow-checks = false
debug-assertions = false

[profile.release-lto-same-as-ripgrep]
inherits = "release"
opt-level = 3
debug = "none"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1

# Want a small binary? Do this:
# RUSTFLAGS="-Zunstable-options -Cpanic=immediate-abort -Zlocation-detail=none -Zfmt-debug=none" \
#     cargo +nightly b \
#        -Z build-std=std,panic_abort \
#        -Z build-std-features= \
#         --profile=release-small --target=x86_64-unknown-linux-gnu --features=use_nightly
[profile.release-small]
inherits = "release"
opt-level = "z"
panic = "abort"
codegen-units = 1
lto = "fat"
strip = true
debug = 0
overflow-checks = false
debug-assertions = false

# also: set RUSTFLAGS="-C force-frame-pointers=yes"
[profile.profiling]
inherits = "release"
debug = true                      # keep DWARF symbols
# split-debuginfo = "packed"        # so perf can find them easily (Linux)
strip = "none"                    # don’t strip symbols
lto = false
codegen-units = 16
overflow-checks = false
panic = "abort"                   # optional: less noise, smaller code

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)'] }
